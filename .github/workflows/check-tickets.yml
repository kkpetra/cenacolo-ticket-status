name: Check ticket availability
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://cenacolovinciano.vivaticket.it/en/event/cenacolo-visite-guidate-a-orario-fisso-in-inglese/238363?idt=2547';
            const checkedAt = new Date().toISOString();
            let check;
            try {
              const response = await fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0 ticket availability monitor' } });
              if (!response.ok) throw new Error('Ticket site returned HTTP ' + response.status);
              const html = await response.text();
              const match = html.match(/new Date\s*\(\s*2026\s*,\s*\(\s*10\s*-\s*1\s*\)\s*,\s*0?2\s*\)\s*,\s*'([0-9]+)'/);
              if (!match) throw new Error('Could not find the 2026-10-02 availability record');
              const availableSeats = Number(match[1]);
              check = { checkedAt, outcome: availableSeats >= 2 ? 'available' : 'unavailable', availableSeats, message: availableSeats >= 2 ? 'At least two tickets appear available (' + availableSeats + ' seats reported).' : 'Fewer than two tickets are currently reported.', source: url };
            } catch (error) {
              check = { checkedAt, outcome: 'error', message: error.message, source: url };
            }
            const file = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: 'data/status.json' });
            const status = JSON.parse(Buffer.from(file.data.content, 'base64').toString('utf8'));
            status.latest = check;
            status.checks = [check, ...(status.checks || [])].slice(0, 200);
            await github.rest.repos.createOrUpdateFileContents({ owner: context.repo.owner, repo: context.repo.repo, path: 'data/status.json', message: 'Update ticket status', content: Buffer.from(JSON.stringify(status, null, 2) + '\n').toString('base64'), sha: file.data.sha });
