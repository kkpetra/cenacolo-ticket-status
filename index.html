<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>最后的晚餐 · 余票监测</title>
<style>body{margin:0;background:#f5f7f3;color:#17221d;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:720px;margin:auto;padding:28px 18px}h1{margin:0;font-size:28px}.sub,.note{color:#607066}.card,table{background:#fff;border:1px solid #dfe6df;border-radius:16px}.card{padding:20px}.status{font-size:21px;font-weight:700}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:10px;background:#a34235}.available .dot{background:#167145}.error .dot{background:#a66a14}dl{display:grid;grid-template-columns:105px 1fr;gap:10px;margin:20px 0 0}dt{color:#68766d}dd{margin:0;font-weight:600}a{color:#135c9a}h2{font-size:18px;margin:30px 0 12px}table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;font-size:14px}th,td{padding:12px;text-align:left;border-bottom:1px solid #edf0ed}th{background:#fafbfa;color:#65736a}.available{color:#167145}.unavailable{color:#a34235}.error{color:#a66a14}.note{font-size:13px;line-height:1.5}</style>
<main><h1>《最后的晚餐》余票监测</h1><p class="sub">英文定时导览 · 2026 年 10 月 2 日 · 2 人</p><section class="card" id="current">正在读取最新状态…</section><h2>检测记录</h2><table><thead><tr><th>检测时间</th><th>结果</th><th>详情</th></tr></thead><tbody id="history"></tbody></table><p class="note">约每 30 分钟更新。请以 Vivaticket 结算页的实际余票为准。</p></main>
<script>const f=x=>new Intl.DateTimeFormat('zh-CN',{dateStyle:'medium',timeStyle:'short',timeZone:'Europe/Rome'}).format(new Date(x))+'（意大利时间）',L={available:'可购买 2 张',unavailable:'暂时无 2 张连票',error:'本次检查异常'};fetch('./data/status.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{let x=d.latest,c=x.outcome;document.querySelector('#current').innerHTML='<div class="status '+c+'"><span class="dot"></span>'+L[c]+'</div><dl><dt>最近检测</dt><dd>'+f(x.checkedAt)+'</dd><dt>检测结果</dt><dd>'+x.message+'</dd><dt>购票链接</dt><dd><a href="'+d.target.source+'" target="_blank" rel="noopener">前往 Vivaticket</a></dd></dl>';document.querySelector('#history').innerHTML=(d.checks||[]).map(x=>'<tr><td>'+f(x.checkedAt)+'</td><td class="'+x.outcome+'">'+L[x.outcome]+'</td><td>'+(x.availableSeats??'—')+(x.availableSeats!==undefined?' 个座位':'')+'</td></tr>').join('')}).catch(()=>document.querySelector('#current').textContent='暂时无法读取状态，请稍后刷新。');</script>
